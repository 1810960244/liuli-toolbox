name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 签名密钥不进仓库：从 Secret 还原成临时文件，构建完随 runner 销毁
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 secret，无法签名"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore.p12

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: '6'
          VERSION_NAME: '1.0.5'
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          chmod +x build.sh
          bash build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: toolbox-apk
          path: android/out/toolbox.apk
          if-no-files-found: error

      - name: Attach to Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/out/toolbox.apk
