name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: '5'
          VERSION_NAME: '1.0.4'
        run: |
          chmod +x build.sh
          bash build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: toolbox-apk
          path: android/out/toolbox.apk
          if-no-files-found: error

      - name: Attach to Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/out/toolbox.apk
